# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'

name: shipment-recovery-demo

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10

  policy-bridge-connection:
    host: azure.ai.connection
    uses:
      - ai-project
    category: RemoteTool
    target: ${POLICY_BRIDGE_URL}
    authType: OAuth2
    authorizationUrl: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/authorize
    tokenUrl: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token
    refreshUrl: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token
    credentials:
      clientId: ${POLICY_BRIDGE_CLIENT_ID}
      clientSecret: ${POLICY_BRIDGE_CLIENT_SECRET}
    scopes:
      - api://${POLICY_BRIDGE_CLIENT_ID}/access_as_user
      - offline_access

  shipment-tools:
    host: azure.ai.toolbox
    uses:
      - ai-project
      - policy-bridge-connection
    tools:
      - type: mcp
        server_label: purchasing-policy-specialist
        connection: policy-bridge-connection
        server_url: ${POLICY_BRIDGE_URL}
        require_approval: never

  shipment-recovery-orchestrator:
    host: azure.ai.agent
    uses:
      - ai-project
      - shipment-tools
    project: src/orchestrator
    language: python
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    kind: hosted
    name: shipment-recovery-orchestrator
    description: Coordinates purchasing policy and supplier specialists to recommend recovery plans for delayed shipments.
    metadata:
      tags:
        - Agent Framework
        - Workflows
        - Concurrent Orchestration
        - A2A
        - Copilot Studio
        - OBO
        - Responses Protocol
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_NAME: shipment-tools
      SHIPMENT_DEMO_MODE: connected
      SHIPMENT_DATA_PATH: data/shipments.json
      SUPPLIER_A2A_BASE_URL: ${SUPPLIER_A2A_BASE_URL}
      RECOVERY_PLANNER_AGENT_NAME: shipment-recovery-planner
    container:
      resources:
        cpu: '1'
        memory: 2Gi

  shipment-recovery-planner:
    host: azure.ai.agent
    uses:
      - ai-project
    project: src/recovery-planner
    language: python
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    kind: hosted
    name: shipment-recovery-planner
    description: Deterministically calculates and ranks recovery options from policy and supplier specialist outputs.
    metadata:
      tags:
        - Agent Framework
        - Hosted Agent
        - Recovery Planning
        - Responses Protocol
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      RECOVERY_PLANNER_MODE: deterministic
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

infra:
  provider: microsoft.foundry
