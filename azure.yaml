# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'

name: foundry-cps-stock-agent

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10

  cps-bridge-connection:
    host: azure.ai.connection
    uses:
      - ai-project
    category: RemoteTool
    target: ${CPS_BRIDGE_URL}
    authType: OAuth2
    authorizationUrl: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/authorize
    tokenUrl: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token
    refreshUrl: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token
    credentials:
      clientId: ${CPS_BRIDGE_CLIENT_ID}
      clientSecret: ${CPS_BRIDGE_CLIENT_SECRET}
    scopes:
      - api://${CPS_BRIDGE_CLIENT_ID}/access_as_user
      - offline_access

  stock-tools:
    host: azure.ai.toolbox
    uses:
      - ai-project
      - cps-bridge-connection
    tools:
      - type: web_search
        name: stock-price-web-search
        description: Find a current public market price and its source.
        require_approval: never
      - type: mcp
        server_label: copilot-studio-stock-analysis
        connection: cps-bridge-connection
        server_url: ${CPS_BRIDGE_URL}
        require_approval: never

  stock-market-agent:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - Hosted Agent
        - Responses Protocol
        - Teams
        - Microsoft 365
        - Copilot Studio
        - OBO
    project: hosted-agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
      - stock-tools
    kind: hosted
    name: stock-market-agent
    description: Looks up a stock price and delegates current-market analysis to Copilot Studio.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_NAME: stock-tools
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

infra:
  provider: microsoft.foundry
